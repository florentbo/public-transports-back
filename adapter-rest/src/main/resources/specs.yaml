openapi: 3.0.3
info:
  title: Public Transport Journey API
  description: |
    API for managing public transport journeys and real-time arrivals.
    Allows users to create and manage their frequent journeys and get real-time arrival information.
  version: 1.0.0
  contact:
    name: Public Transport API Team
    email: api@example.com

security:
  - bearerAuth: [ ]

paths:
  /journeys:
    post:
      summary: Create a new journey
      description: Creates a new journey with origin and destination locations
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyCreate'
      responses:
        '201':
          description: Journey created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      summary: Get all journeys for current user
      description: Retrieves all journeys associated with the authenticated user
      operationId: getCurrentUserJourneys
      responses:
        '200':
          description: List of journeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journey'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /journeys/{journeyId}:
    parameters:
      - name: journeyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get journey by ID
      operationId: getJourneyById
      responses:
        '200':
          description: Journey found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete journey
      operationId: deleteJourney
      responses:
        '204':
          description: Journey deleted
        '404':
          description: Journey not found

  /journeys/{journeyId}/trips:
    parameters:
      - name: journeyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Add a trip to a journey
      operationId: addTripToJourney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /journeys/{journeyId}/transport-options:
    get:
      summary: Get transport options for a journey
      operationId: getTransportOptions
      parameters:
        - name: journeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transport options retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportOptions'
        '404':
          description: Journey not found

  /stations/search:
    get:
      summary: Search for transport stations
      operationId: searchStations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of matching stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransportStation'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Location:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Location name

    JourneyCreate:
      type: object
      required:
        - origin
        - destination
      properties:
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'

    Journey:
      type: object
      required:
        - id
        - origin
        - destination
      properties:
        id:
          type: string
          format: uuid
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransportStation:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Station identifier (e.g., NaptanId)
        name:
          type: string
          description: Station name
        lines:
          type: array
          items:
            type: string
          description: Available transport lines at this station

    TripCreate:
      type: object
      required:
        - startingPoint
        - direction
      properties:
        startingPoint:
          $ref: '#/components/schemas/TransportStation'
        direction:
          type: string
          description: Direction or final destination of the transport line

    Trip:
      type: object
      required:
        - id
        - startingPoint
        - direction
      properties:
        id:
          type: integer
          format: int64
        startingPoint:
          $ref: '#/components/schemas/TransportStation'
        direction:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        createdAt:
          type: string
          format: date-time

    ArrivalTime:
      type: object
      required:
        - platformName
        - destinationName
        - estimatedTimeOfArrival
      properties:
        platformName:
          type: string
        destinationName:
          type: string
        estimatedTimeOfArrival:
          type: string
          format: date-time
        scheduledTimeOfArrival:
          type: string
          format: date-time
        minutesUntilArrival:
          type: integer
        status:
          type: string
          enum:
            - ON_TIME
            - DELAYED
            - CANCELLED

    TransportOptions:
      type: object
      required:
        - transportOptions
      properties:
        transportOptions:
          type: array
          items:
            $ref: '#/components/schemas/TransportOption'

    TransportOption:
      type: object
      required:
        - type
        - line
        - startStation
        - direction
        - arrivals
      properties:
        type:
          type: string
          enum: [ metro, tram, bus, train ]
        line:
          type: string
        startStation:
          type: string
        direction:
          type: string
        arrivals:
          type: array
          items:
            $ref: '#/components/schemas/Arrival'

    Arrival:
      type: object
      required:
        - time
        - platform
      properties:
        time:
          type: integer
          description: Minutes until arrival
        platform:
          type: string

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_INPUT"
        message:
          type: string
          example: "Invalid input provided"
        details:
          type: object
          additionalProperties: true
